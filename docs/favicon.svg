<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Горшок в две краски: тулово одним силуэтом и тёмное устье эллипсом.
    Эллипс тут несёт всю узнаваемость — без него силуэт читается как мешок.
    Ни теней, ни бликов: на 16 пикселях они превращаются в грязь.
  -->
  <path d="M10 6.6
           C10 10.4 4 12.8 4 18
           C4 22.6 7.6 26.6 11.4 27.4
           L20.6 27.4
           C24.4 26.6 28 22.6 28 18
           C28 12.8 22 10.4 22 6.6
           A6 2.3 0 0 1 10 6.6 Z"
        fill="#c9713f"/>
  <ellipse cx="16" cy="6.6" rx="6" ry="2.3" fill="#7d3f1f"/>
</svg>
